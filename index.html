<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir Pro | Modern POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-slate-800">MY STORE POS</h1>
            <p class="text-slate-500">Sistem Kasir Profesional v2.0</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <input type="text" id="barcodeInput" 
                           class="w-full p-4 border-2 border-blue-500 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-200 text-lg" 
                           placeholder="Scan Barcode / Ketik Kode Produk..." 
                           onkeydown="if(event.key==='Enter') addProduct()">
                </div>

                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 min-h-[400px]">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="text-slate-400 uppercase text-sm border-b">
                                <th class="pb-3">Item</th>
                                <th class="pb-3">Harga</th>
                                <th class="pb-3 text-right">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="cartTable"></tbody>
                    </table>
                </div>
            </div>

            <div class="bg-slate-800 text-white p-6 rounded-2xl shadow-xl flex flex-col justify-between">
                <div>
                    <h2 class="text-xl font-semibold mb-6">Ringkasan Pembayaran</h2>
                    <div class="space-y-4">
                        <div class="flex justify-between text-slate-300">
                            <span>Total Tagihan</span>
                            <span class="text-xl font-bold text-white">Rp <span id="total">0</span></span>
                        </div>
                        <div class="pt-4 border-t border-slate-700">
                            <label class="block text-sm mb-2 text-slate-400">Uang Tunai (Rp)</label>
                            <input type="number" id="inputBayar" 
                                   class="w-full p-3 rounded-lg bg-slate-700 border-none text-white text-xl font-bold" 
                                   placeholder="0" oninput="hitungKembalian()">
                        </div>
                        <div class="mt-6 p-4 bg-slate-700 rounded-lg">
                            <p class="text-slate-400 text-sm">Kembalian</p>
                            <h3 class="text-3xl font-bold text-green-400">Rp <span id="kembalianDisplay">0</span></h3>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col gap-3 mt-8">
                    <button onclick="window.print()" class="w-full py-4 rounded-xl bg-blue-600 hover:bg-blue-500 font-bold transition">Cetak Struk</button>
                    <button onclick="selesaiTransaksi()" class="w-full py-4 rounded-xl border border-slate-600 hover:bg-slate-700 font-bold transition">Transaksi Selesai</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const dbBarang = {
            "mie": { nama: "Indomie Goreng", harga: 3500, stok: 10 },
            "susu": { nama: "Susu UHT 200ml", harga: 7000, stok: 5 },
            "air": { nama: "Air Mineral 600ml", harga: 3000, stok: 20 },
            "sabun": { nama: "Sabun Mandi", harga: 5500, stok: 8 }
        };

        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        
        function addProduct() {
            let code = document.getElementById('barcodeInput').value;
            let item = dbBarang[code];
            if(item && item.stok > 0) {
                item.stok--; 
                cart.push({...item}); 
                saveAndRefresh();
            } else {
                alert("Barang tidak ada atau stok habis!");
            }
            document.getElementById('barcodeInput').value = "";
        }

        function removeItem(index) {
            let itemRemoved = cart.splice(index, 1)[0];
            Object.values(dbBarang).forEach(b => { if(b.nama === itemRemoved.nama) b.stok++; });
            saveAndRefresh();
        }

        function saveAndRefresh() {
            localStorage.setItem('cart', JSON.stringify(cart));
            updateUI();
        }

        function updateUI() {
            let html = "";
            let total = 0;
            cart.forEach((item, index) => {
                html += `<tr class="border-b border-slate-50 last:border-0">
                            <td class="py-4 font-medium text-slate-700">${item.nama}</td>
                            <td class="py-4 text-slate-600">Rp ${item.harga.toLocaleString()}</td>
                            <td class="py-4 text-right"><button onclick="removeItem(${index})" class="text-red-400 hover:text-red-600">Hapus</button></td>
                         </tr>`;
                total += item.harga;
            });
            document.getElementById('cartTable').innerHTML = html;
            document.getElementById('total').innerText = total.toLocaleString();
            hitungKembalian();
        }

        function hitungKembalian() {
            let total = parseInt(document.getElementById('total').innerText.replace(/,/g, '')) || 0;
            let bayar = parseInt(document.getElementById('inputBayar').value) || 0;
            document.getElementById('kembalianDisplay').innerText = (bayar >= total && total > 0) ? (bayar - total).toLocaleString() : "0";
        }

        function selesaiTransaksi() {
            if(confirm("Selesaikan transaksi ini?")) {
                cart = []; 
                saveAndRefresh();
                document.getElementById('inputBayar').value = "";
                document.getElementById('kembalianDisplay').innerText = "0";
            }
        }

        updateUI();
    </script>
</body>
</html>
