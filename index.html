<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasir Toko Premium</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:
linear-gradient(135deg,#0f172a,#1e293b);
color:white;
min-height:100vh;
padding:30px;
}

.container{
max-width:1200px;
margin:auto;
}

.header{
text-align:center;
margin-bottom:30px;
}

.header h1{
font-size:3rem;
}

.grid{
display:grid;
grid-template-columns:400px 1fr;
gap:25px;
}

.card{
background:rgba(255,255,255,.05);
backdrop-filter:blur(15px);
border-radius:20px;
padding:20px;
border:1px solid rgba(255,255,255,.1);
}

input{
width:100%;
padding:12px;
margin-top:10px;
margin-bottom:15px;
border:none;
border-radius:10px;
background:#1e293b;
color:white;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#06b6d4;
color:white;
font-weight:700;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:12px;
text-align:left;
}

tr{
border-bottom:1px solid rgba(255,255,255,.1);
}

.total{
font-size:1.4rem;
font-weight:700;
margin-top:20px;
}

.history{
margin-top:25px;
}

.history-item{
background:#1e293b;
padding:10px;
border-radius:10px;
margin-top:10px;
}

@media(max-width:900px){

.grid{
grid-template-columns:1fr;
}

}

</style>
</head>
<body>

<div class="container">

<div class="header">
<h1>🛒 Kasir Toko</h1>
<p>Sistem Kasir Modern</p>
</div>

<div class="grid">

<div class="card">

<h2>Tambah Barang</h2>

<input type="text" id="nama" placeholder="Nama Barang">

<input type="number" id="harga" placeholder="Harga">

<input type="number" id="jumlah" placeholder="Jumlah">

<button onclick="tambahBarang()">
Tambah ke Keranjang
</button>

</div>

<div class="card">

<h2>Keranjang</h2>

<table>

<thead>
<tr>
<th>Barang</th>
<th>Harga</th>
<th>Qty</th>
<th>Total</th>
</tr>
</thead>

<tbody id="keranjang">
</tbody>

</table>

<div class="total">
Total Belanja :
Rp <span id="total">0</span>
</div>

<hr style="margin:20px 0">

<input
type="number"
id="bayar"
placeholder="Uang Pembeli"
oninput="hitungKembalian()">

<div class="total">
Kembalian :
Rp <span id="kembalian">0</span>
</div>

<button
style="margin-top:20px"
onclick="simpanTransaksi()">
Simpan Transaksi
</button>

<button
style="margin-top:10px;background:#22c55e"
onclick="cetakStruk()">
🧾 Cetak Struk
</button>

<div class="history">

<h3>Riwayat</h3>

<div id="historyList"></div>

</div>

</div>

</div>

</div>

<script>

let cart=[];
let total=0;

function tambahBarang(){

let nama=
document.getElementById("nama").value;

let harga=
parseInt(document.getElementById("harga").value);

let jumlah=
parseInt(document.getElementById("jumlah").value);

if(!nama || !harga || !jumlah){
return;
}

let subtotal=
harga*jumlah;

cart.push({
nama,
harga,
jumlah,
subtotal
});

renderCart();

document.getElementById("nama").value="";
document.getElementById("harga").value="";
document.getElementById("jumlah").value="";
}

function renderCart(){

let tbody=
document.getElementById("keranjang");

tbody.innerHTML="";

total=0;

cart.forEach(item=>{

total+=item.subtotal;

tbody.innerHTML+=`
<tr>
<td>${item.nama}</td>
<td>${item.harga}</td>
<td>${item.jumlah}</td>
<td>${item.subtotal}</td>
</tr>
`;

});

document.getElementById("total").innerText=total;

hitungKembalian();
}

function hitungKembalian(){

let bayar=
parseInt(
document.getElementById("bayar").value
)||0;

let kembali=
bayar-total;

document.getElementById("kembalian")
.innerText=
kembali>0 ? kembali : 0;
}

function simpanTransaksi(){

if(total===0)return;

let history=
document.getElementById("historyList");

let div=
document.createElement("div");

div.className=
"history-item";

div.innerHTML=
`
Transaksi Rp ${total}
`;

history.prepend(div);

cart=[];
total=0;

document.getElementById("keranjang")
.innerHTML="";

document.getElementById("total")
.innerText="0";

document.getElementById("kembalian")
.innerText="0";

document.getElementById("bayar")
.value="";
}


function cetakStruk(){

if(cart.length===0){
alert("Keranjang masih kosong!");
return;
}

let bayar =
parseInt(document.getElementById("bayar").value) || 0;

let kembali = bayar - total;

let isi = "";

cart.forEach(item=>{

isi += `
<tr>
<td>${item.nama}</td>
<td>${item.jumlah}</td>
<td>Rp ${item.subtotal.toLocaleString()}</td>
</tr>
`;

});

let struk = `
<html>
<head>
<title>Struk Belanja</title>

<style>

body{
font-family:monospace;
padding:20px;
}

h2{
text-align:center;
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

td,th{
padding:5px;
border-bottom:1px dashed #000;
}

.total{
margin-top:15px;
font-weight:bold;
}

</style>

</head>

<body>

<h2>TOKO WILDAN</h2>

<p>${new Date().toLocaleString()}</p>

<table>

<tr>
<th>Barang</th>
<th>Qty</th>
<th>Total</th>
</tr>

${isi}

</table>

<div class="total">
Total : Rp ${total.toLocaleString()}
</div>

<div class="total">
Bayar : Rp ${bayar.toLocaleString()}
</div>

<div class="total">
Kembali : Rp ${kembali.toLocaleString()}
</div>

<br>

<p>Terima Kasih 🙏</p>

</body>
</html>
`;

let win = window.open("","","width=400,height=600");

win.document.write(struk);

win.document.close();

win.print();

}
</script>

</body>
</html>
