<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>TabunganKu Pro</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

:root{
--gold:#c9a84c;
--dark:#0f1115;
--card:#1b1f27;
--green:#35d07f;
--red:#ff5b5b;
}

body{
background:var(--dark);
color:white;

min-height:100vh;

padding:30px 20px;
}

.container{
width:100%;
max-width:700px;
margin:auto;
}

h1{
font-size:42px;
margin-bottom:25px;
color:var(--gold);
}

.top-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;

margin-bottom:25px;
}

.top-card{
background:var(--card);
padding:20px;
border-radius:22px;

border:1px solid rgba(255,255,255,.05);
}

.top-card p{
opacity:.6;
margin-bottom:10px;
font-size:14px;
}

.top-card h2{
font-size:28px;
}

.menu{
display:flex;
gap:15px;

margin-bottom:20px;
}

.menu button{
flex:1;
}

button{
padding:16px;
border:none;
border-radius:16px;

background:var(--gold);

font-weight:bold;
cursor:pointer;

transition:.3s;
}

button:hover{
transform:translateY(-3px);
}

.pilihan-transaksi{
display:flex;
gap:12px;
}

.pilih-btn{
flex:1;

background:#0f1115;

color:white;

border:1px solid rgba(255,255,255,.08);
}

.pilih-btn.aktif{
background:var(--gold);
color:black;
}

.form-box{
background:var(--card);

padding:20px;

border-radius:24px;

display:flex;
flex-direction:column;
gap:15px;

margin-bottom:25px;

border:1px solid rgba(255,255,255,.05);
}

input,
select{
padding:15px;

border:none;
outline:none;

border-radius:14px;

background:#0f1115;
color:white;
}

.list{
display:flex;
flex-direction:column;
gap:15px;
}

.item{
background:var(--card);

padding:18px;

border-radius:18px;

display:flex;
justify-content:space-between;
align-items:center;

border:1px solid rgba(255,255,255,.05);

animation:muncul .3s ease;
}

.item p{
opacity:.6;
margin-top:6px;
font-size:14px;
}

.masuk{
border-left:6px solid var(--green);
}

.keluar{
border-left:6px solid var(--red);
}

.green{
color:var(--green);
}

.red{
color:var(--red);
}

.rekap-box{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
}

.rekap-card{
background:var(--card);

padding:25px;

border-radius:20px;

border:1px solid rgba(255,255,255,.05);
}

.rekap-card h3{
margin-bottom:12px;
}

.rekap-card p{
opacity:.7;
line-height:1.7;
}

@keyframes muncul{

from{
opacity:0;
transform:translateY(20px);
}

to{
opacity:1;
transform:translateY(0);
}

}

@media(max-width:600px){

.item{
flex-direction:column;
align-items:flex-start;
gap:10px;
}

h1{
font-size:34px;
}

}

</style>
</head>
<body>

<div class="container">

<h1>💰 TabunganKu</h1>

<!-- TOP INFO -->

<div class="top-grid">

<div class="top-card">
<p>Total Saldo</p>
<h2 id="saldo">Rp 0</h2>
</div>

<div class="top-card">
<p>Total Pemasukan</p>
<h2 id="totalMasuk" class="green">
Rp 0
</h2>
</div>

<div class="top-card">
<p>Total Pengeluaran</p>
<h2 id="totalKeluar" class="red">
Rp 0
</h2>
</div>

</div>

<!-- MENU -->

<div class="menu">

<button onclick="scrollRekap()">
📊 Lihat Rekap
</button>
</div>

<!-- FORM -->

<div class="form-box">

<input
type="number"
id="jumlah"
placeholder="Jumlah uang"
>

<div class="pilihan-transaksi">

<button
type="button"
class="pilih-btn aktif"
id="btnMasuk"
onclick="pilihTipe('masuk')"
>
💸 Nabung
</button>

<button
type="button"
class="pilih-btn"
id="btnKeluar"
onclick="pilihTipe('keluar')"
>
🧾 Ambil Tabungan
</button>

</div>

<button onclick="tambahTransaksi()">
Tambah Transaksi
</button>

</div>

<div class="list" id="semuaList">
</div>
<!-- REKAP -->

<div id="rekap"></div>

<div class="rekap-box">

<div class="rekap-card">
<h3>📅 Rekap Bulanan</h3>

<p id="rekapBulanan">
Belum ada data
</p>
</div>

<div class="rekap-card">
<h3>📆 Rekap Tahunan</h3>

<p id="rekapTahunan">
Belum ada data
</p>
</div>

</div>

</div>

</div>

<script>

let saldo = 0;

let tipe = 'masuk';

function pilihTipe(jenis){

tipe = jenis;

document
.getElementById('btnMasuk')
.classList.remove('aktif');

document
.getElementById('btnKeluar')
.classList.remove('aktif');

if(jenis === 'masuk'){

document
.getElementById('btnMasuk')
.classList.add('aktif');

}else{

document
.getElementById('btnKeluar')
.classList.add('aktif');

}

}

let totalMasuk = 0;

let totalKeluar = 0;

function tambahTransaksi(){

const jumlah =
parseInt(
document.getElementById('jumlah').value
);

if(!jumlah){

alert('Isi dulu cuyy 😭');

return;
}

if(tipe === 'masuk'){

saldo += jumlah;

totalMasuk += jumlah;

}else{

saldo -= jumlah;

totalKeluar += jumlah;

}

document.getElementById('saldo')
.innerText =
'Rp ' +
saldo.toLocaleString('id-ID');

document.getElementById('totalMasuk')
.innerText =
'Rp ' +
totalMasuk.toLocaleString('id-ID');

document.getElementById('totalKeluar')
.innerText =
'Rp ' +
totalKeluar.toLocaleString('id-ID');

const item =
document.createElement('div');

item.classList.add('item');

item.classList.add(tipe);

item.innerHTML = `

<div>

<h3>
${tipe === 'masuk'
? '💸 Nabung'
: '🧾 Ambil Tabungan'}
</h3>

<p>
${new Date().toLocaleString('id-ID')}
</p>

</div>

<h3 class="${
tipe === 'masuk'
? 'green'
: 'red'
}">

${tipe === 'masuk'
? '+'
: '-'
}

Rp ${jumlah.toLocaleString('id-ID')}

</h3>

`;

document
.getElementById('semuaList')
.prepend(item);

const clone =
item.cloneNode(true);

if(tipe === 'masuk'){

document
.getElementById('masukList')
.prepend(clone);

}else{

document
.getElementById('keluarList')
.prepend(clone);

}

document
.getElementById('rekapBulanan')
.innerHTML = `

Total pemasukan bulan ini:
<b class="green">
Rp ${totalMasuk.toLocaleString('id-ID')}
</b>

<br><br>

Total pengeluaran bulan ini:
<b class="red">
Rp ${totalKeluar.toLocaleString('id-ID')}
</b>

`;

document
.getElementById('rekapTahunan')
.innerHTML = `

Saldo tahun ini:
<b style="color:var(--gold)">
Rp ${saldo.toLocaleString('id-ID')}
</b>

<br><br>

Total transaksi:
<b>
${document.querySelectorAll('#semuaList .item').length}
</b>

`;


document.getElementById('jumlah').value='';

}

function scrollRekap(){

document
.getElementById('rekap')
.scrollIntoView({

behavior:'smooth'

});

}
</script>

</body>
</html>
