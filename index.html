<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>TabunganKu Pro</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

:root{
--gold:#c9a84c;
--dark:#0f1115;
--card:#1b1f27;
--green:#35d07f;
--red:#ff5b5b;
}

body{

background:linear-gradient(
-45deg,
#0f1115,
#171b22,
#1d2230,
#111827
);

background-size:400% 400%;

animation:bgMove 12s ease infinite;

color:white;

padding:25px;

}

.container{
max-width:760px;
margin:auto;
}

@keyframes bgMove{

0%{background-position:0% 50%;}

50%{background-position:100% 50%;}

100%{background-position:0% 50%;}

}

/* PROFILE */

.profile{

background:rgba(255,255,255,.05);

backdrop-filter:blur(12px);

padding:22px;

border-radius:28px;

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:25px;

}

.profile-left{

display:flex;

gap:18px;

align-items:center;

}

.avatar{

width:80px;
height:80px;

border-radius:50%;

overflow:hidden;

border:3px solid var(--gold);

}

.avatar img{

width:100%;
height:100%;

object-fit:cover;

}

.profile h2{

font-size:26px;

margin-bottom:6px;

}

.profile p{

opacity:.7;

}

.date{

opacity:.55;

font-size:13px;

margin-top:8px;

}

/* TOP */

.top-grid{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(180px,1fr));

gap:14px;

margin-bottom:22px;

}

.card{

background:var(--card);

padding:20px;

border-radius:22px;

}

.card p{

opacity:.65;

margin-bottom:10px;

}

.card h2{

font-size:28px;

}

/* FORM */

.form{

background:var(--card);

padding:22px;

border-radius:24px;

display:flex;

flex-direction:column;

gap:15px;

margin-bottom:22px;

}

input{

padding:15px;

border:none;

outline:none;

border-radius:16px;

background:#10141c;

color:white;

}

.btn-row{

display:flex;

gap:12px;

}

button{

padding:15px;

border:none;

border-radius:16px;

cursor:pointer;

font-weight:bold;

}

.btn{

flex:1;

background:#10141c;

color:white;

}

.active{

background:var(--gold);

color:black;

}

.main-btn{

background:var(--gold);

}

/* LIST */

.list{

display:flex;

flex-direction:column;

gap:14px;

}

.item{

background:var(--card);

padding:18px;

border-radius:18px;

display:flex;

justify-content:space-between;

align-items:center;

}

.masuk{

border-left:6px solid var(--green);

}

.keluar{

border-left:6px solid var(--red);

}

.green{

color:var(--green);

}

.red{

color:var(--red);

}

/* MODAL */

.modal{

position:fixed;

inset:0;

background:rgba(0,0,0,.7);

display:none;

justify-content:center;

align-items:center;

padding:20px;

}

.show{

display:flex;

}

.modal-box{

background:var(--card);

padding:28px;

border-radius:28px;

width:100%;

max-width:520px;

position:relative;

}

.close{

position:absolute;

top:12px;

right:12px;

width:42px;

height:42px;

border-radius:50%;

background:#2b3340;

color:white;

}

.rekap{

background:#11151d;

padding:18px;

border-radius:18px;

margin-top:18px;

}

</style>
</head>
<body>

<div class="container">

<div class="profile">

<div class="profile-left">

<div class="avatar">

<img src="https://i.ibb.co.com/PzvcQyZ3/profile-jpg.jpg">

</div>

<div>

<h2>TabunganKu Pro</h2>

<p>Kelola tabunganmu dengan rapi 👋</p>

<div class="date" id="tanggal"></div>

</div>

</div>

<button onclick="bukaRekap()">
📊 Rekap
</button>

</div>

<div class="top-grid">

<div class="card">

<p>Total Saldo</p>

<h2 id="saldo">
Rp 0
</h2>

</div>

<div class="card">

<p>Total Nabung</p>

<h2 id="masuk" class="green">
Rp 0
</h2>

</div>

<div class="card">

<p>Total Diambil</p>

<h2 id="keluar" class="red">
Rp 0
</h2>

</div>

</div>

<div class="form">

<input
type="number"
id="jumlah"
placeholder="Jumlah uang">

<div class="btn-row">

<button
class="btn active"
id="btnMasuk"
onclick="pilih('masuk')">
💸 Nabung
</button>

<button
class="btn"
id="btnKeluar"
onclick="pilih('keluar')">
🧾 Ambil
</button>

</div>

<button
class="main-btn"
onclick="tambah()">
Tambah Transaksi
</button>

</div>

<div class="list" id="list"></div>

</div>

<div class="modal" id="modal">

<div class="modal-box">

<button
class="close"
onclick="tutupRekap()">
✕
</button>

<h2>📊 Rekap Tabungan</h2>

<div class="rekap">

<h3>Bulanan</h3>

<p id="rekapBulanan"></p>

</div>

<div class="rekap">

<h3>Tahunan</h3>

<p id="rekapTahunan"></p>

</div>

</div>

</div>

<script>

let saldo=0;
let totalMasuk=0;
let totalKeluar=0;
let tipe='masuk';

tanggal.innerText=
new Date().toLocaleString('id-ID',{
dateStyle:'full'
});

function pilih(x){

tipe=x;

btnMasuk.classList.remove('active');
btnKeluar.classList.remove('active');

if(x==='masuk'){
btnMasuk.classList.add('active');
}else{
btnKeluar.classList.add('active');
}

}

function tambah(){

const jumlah=
parseInt(
document.getElementById('jumlah').value
);

if(!jumlah||jumlah<=0){

alert('Nominal tidak valid');

return;

}

if(
tipe==='keluar'
&&
jumlah>saldo
){

alert('Saldo tidak cukup');

return;

}

if(tipe==='masuk'){

saldo+=jumlah;
totalMasuk+=jumlah;

}else{

saldo-=jumlah;
totalKeluar+=jumlah;

}

saldoEl();
buatItem(jumlah);

jumlahInput();

rekap();

}

function saldoEl(){

saldo.innerText=
'Rp '+saldo.toLocaleString('id-ID');

masuk.innerText=
'Rp '+totalMasuk.toLocaleString('id-ID');

keluar.innerText=
'Rp '+totalKeluar.toLocaleString('id-ID');

}

function buatItem(jumlah){

const item=
document.createElement('div');

item.className=
`item ${tipe}`;

item.innerHTML=`

<div>

<h3>
${tipe==='masuk'
?'💸 Nabung'
:'🧾 Ambil'}
</h3>

<p>
${new Date()
.toLocaleString('id-ID')}
</p>

</div>

<h3 class="${
tipe==='masuk'
?'green'
:'red'
}">

${tipe==='masuk'?'+':'-'}

Rp ${jumlah.toLocaleString('id-ID')}

</h3>

`;

list.prepend(item);

}

function jumlahInput(){

document
.getElementById('jumlah')
.value='';

}

function rekap(){

rekapBulanan.innerHTML=`

Total Nabung:
<b class="green">
Rp ${totalMasuk.toLocaleString('id-ID')}
</b>

<br><br>

Total Ambil:
<b class="red">
Rp ${totalKeluar.toLocaleString('id-ID')}
</b>

`;

rekapTahunan.innerHTML=`

Saldo:
<b style="color:var(--gold)">
Rp ${saldo.toLocaleString('id-ID')}
</b>

`;

}

function bukaRekap(){

modal.classList.add('show');

}

function tutupRekap(){

modal.classList.remove('show');

}

</script>

</body>
</html>
